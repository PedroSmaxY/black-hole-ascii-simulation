[package]
name = "black-hole-ascii-simulation"
version = "0.1.0"
edition = "2021"
authors = ["PedroSmaxY <pedrohenrique.nv@icloud.com>"]
description = "Gargantua-class relativistic black hole simulator in TrueColor ANSI Half-Block geodesic raymarching"
license = "MIT"
keywords = ["black-hole", "gargantua", "ascii", "relativity", "raymarching"]
categories = ["command-line-utilities", "science", "simulation", "rendering"]

[dependencies]
crossterm = "0.28"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
